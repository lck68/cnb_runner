name: github构建macos-arm64.dmg工作流
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: false
        default: 'main'

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: 从 CNB 克隆代码
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.branch }}" \
            "https://cnbcool:${{ secrets.CNB_TOKEN }}@cnb.cool/icxk/SFshell.git" repo
          echo "=== 克隆完成 ==="
          ls -la repo/
        shell: bash

      - name: 预装构建工具
        run: |
          brew install node@20 python@3.12
          echo "$(brew --prefix python@3.12)/libexec/bin" >> $GITHUB_PATH
          node -v && npm -v
          python3 --version
        shell: bash

      - name: 构建前端
        run: |
          cd repo/client
          npm install
          npm run build
        shell: bash

      - name: 创建虚拟环境并安装依赖
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          cd repo
          pip install -r server/requirements.txt
        shell: bash

      - name: PyInstaller 打包
        run: |
          source .venv/bin/activate
          cd repo
          pyinstaller --clean build_macos.spec
        shell: bash

      - name: 生成 DMG 安装包
        run: |
          APP="repo/dist/SFshell.app"

          echo "=== 验证 .app ==="
          ls "$APP/Contents/MacOS/SFshell" || {
            echo "ERROR: .app 不存在，dist 目录内容:"
            ls -la repo/dist/
            exit 1
          }
          echo "OK"
          echo ""

          STAGE="dmg_stage"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          APP_SIZE=$(du -sk "$STAGE" | cut -f1)
          DMG_SIZE=$((APP_SIZE + 20480))

          DMG_TMP="SFshell-tmp.dmg"
          DMG_FINAL="SFshell-macOS-arm64.dmg"

          hdiutil create -volname "SFshell" -srcfolder "$STAGE" -ov -format UDRW \
            -size ${DMG_SIZE}k "$DMG_TMP"

          DEV=$(hdiutil attach -readwrite -noverify -noautoopen "$DMG_TMP" | egrep '^/dev/' | sed 1q | awk '{print $1}')
          sleep 2

          osascript <<EOF
          tell application "Finder"
            tell disk "SFshell"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {400, 200, 900, 500}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 96
              set position of item "SFshell.app" of container window to {140, 130}
              set position of item "Applications" of container window to {360, 130}
              close
            end tell
          end tell
          EOF

          hdiutil detach "$DEV" -force
          hdiutil convert "$DMG_TMP" -format UDZO -imagekey zlib-level=9 -o "$DMG_FINAL"
          rm -f "$DMG_TMP"

          echo ""
          echo "=== DMG 已生成 ==="
          ls -lh "$DMG_FINAL"
        shell: bash

      - name: 上传制品（GitHub Actions）
        uses: actions/upload-artifact@v4
        with:
          name: SFshell-macOS-arm64
          path: SFshell-macOS-arm64.dmg
          retention-days: 30
