name: github构建windows-arm64工作流test
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: false
        default: 'main'

jobs:
  build-windows-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 120

    steps:
      - name: 从 CNB 克隆代码
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.branch }}" \
            "https://cnbcool:${{ secrets.CNB_TOKEN }}@cnb.cool/icxk/SFshell.git" repo
          echo "=== 克隆完成 ==="
          ls -la repo/
        shell: bash

      - name: 安装构建工具 (CMake & Ninja)
        run: |
          choco install cmake ninja -y
          echo "C:\Program Files\CMake\bin" >> $GITHUB_PATH
        shell: bash

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'arm64'

      - name: 升级 pip 和构建依赖
        run: |
          python -m pip install --upgrade pip
          # 预装 maturin 和 wheel，避免后续从源码编译
          python -m pip install maturin wheel setuptools-rust
        shell: bash

      - name: 配置 Rust ARM64 工具链
        run: |
          rustup target add aarch64-pc-windows-msvc
          # 确保 cargo 使用正确的 target
          echo "CARGO_BUILD_TARGET=aarch64-pc-windows-msvc" >> $GITHUB_ENV
        shell: bash

      - name: 构建前端
        run: |
          cd repo/client
          npm install
          npm run build
        shell: bash

      - name: 创建虚拟环境并安装依赖
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          cd repo
          # 尝试安装，如果 pyreqwest-impersonate 依然失败，请看下方的"方案三"
          pip install -r server/requirements.txt
        shell: bash
        env:
          # 提示 cmake 使用 Ninja 生成器，这在 Windows 上更稳定
          CMAKE_GENERATOR: Ninja

      - name: PyInstaller 打包
        run: |
          source .venv/Scripts/activate
          cd repo
          pyinstaller --clean build.spec
        shell: bash

      - name: 验证并打包 Windows 制品
        run: |
          cd repo
          echo "=== 验证 dist 目录 ==="
          ls -la dist/
          
          echo "=== 开始打包为 ZIP ==="
          tar -a -c -f ../SFshell-Windows-arm64.zip -C dist .
          
          echo ""
          echo "=== ZIP 已生成 ==="
          ls -lh ../SFshell-Windows-arm64.zip
        shell: bash

      - name: 上传制品（GitHub Actions）
        uses: actions/upload-artifact@v4
        with:
          name: SFshell-Windows-arm64
          path: SFshell-Windows-arm64.zip
          retention-days: 30
