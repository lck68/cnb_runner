name: CNB test
on:
  workflow_dispatch:

jobs:
  # ===================================================================
  # macOS：直接用 GH Actions 构建（orange-runner 无法 fork/exec）
  # ===================================================================
  build-macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: amd64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 预装构建工具
        run: |
          brew install node@20
          node -v && npm -v
          python3 --version && pip3 --version
        shell: bash

      - name: 构建前端
        run: |
          cd client
          npm install
          npm run build
        shell: bash

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install -r server/requirements.txt
        shell: bash

      - name: PyInstaller 打包
        run: |
          python3 -m PyInstaller --clean build.spec
        shell: bash

      - name: 查看产物
        run: |
          echo "=== dist 目录 ==="
          ls -la dist/
          echo "=== SFshell.app ==="
          ls -la dist/SFshell.app/Contents/MacOS/ 2>/dev/null || echo "非 .app 格式"
        shell: bash

      - name: 打包制品
        run: |
          cd dist
          zip -r "SFshell-macOS-${{ matrix.arch }}.zip" *
          echo "制品: $(pwd)/SFshell-macOS-${{ matrix.arch }}.zip"
        shell: bash

      - name: 上传制品（GitHub Actions）
        uses: actions/upload-artifact@v4
        with:
          name: SFshell-macOS-${{ matrix.arch }}
          path: dist/SFshell-macOS-${{ matrix.arch }}.zip
          retention-days: 30

  # ===================================================================
  # Windows：orange-runner 正常，可用于 CNB 流水线
  # ===================================================================
  start-runner-windows:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
            id_secret: SELF_HOSTED_ID_WIN_AMD64
          - os: windows-11-arm
            arch: arm64
            id_secret: SELF_HOSTED_ID_WIN_ARM64

    env:
      RUNNER_VERSION: "1.68.0"
      ORANGE_RUNNER_CONFIG_DIR: C:\orange-ci\etc
      ORANGE_RUNNER_DATA_DIR: C:\orange-ci\data

    steps:
      - name: 初始化目录
        run: |
          New-Item -Path "$env:ORANGE_RUNNER_CONFIG_DIR/orange-ci" -ItemType Directory -Force
          New-Item -Path "$env:ORANGE_RUNNER_DATA_DIR/orange-runner/logs" -ItemType Directory -Force
        shell: pwsh

      - name: 下载并配置 orange-runner
        run: |
          $ArchiveName = "orange-runner-$env:RUNNER_VERSION-windows-${{ matrix.arch }}.zip"
          $DownloadPath = "$env:RUNNER_TEMP\$ArchiveName"
          $InstallDir = "C:\orange-runner"

          Invoke-WebRequest -Uri "https://cnb.cool/cnb/cool/orange-runner-doc/-/releases/download/$env:RUNNER_VERSION/$ArchiveName" -OutFile $DownloadPath
          New-Item -Path $InstallDir -ItemType Directory -Force
          Expand-Archive -Path $DownloadPath -DestinationPath $InstallDir -Force

          $InstallDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $config = [PSCustomObject]@{
              cpus = -1
              defaultCpus = -1
              memory = -1
              quotaSize = @{}
              allowUseThisRunner = @{}
              useDocker = $false
              disableRsync = $true
              disableTls = $true
              connectorEndpoint = "${{ secrets.CONNECTOR_ENDPOINT }}"
              selfHostedId = "${{ secrets[matrix.id_secret] }}"
              dataRootDir = $env:ORANGE_RUNNER_DATA_DIR
          }
          $config | ConvertTo-Json -Depth 10 | Out-File -FilePath "$env:ORANGE_RUNNER_CONFIG_DIR\orange-ci\runner-config.json" -Encoding utf8
        shell: pwsh

      - name: 启动 CNB Runner
        run: orange-runner.exe
        shell: pwsh
