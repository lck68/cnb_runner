name: CNB macos fuck app
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: false
        default: 'main'

jobs:
  # ===================================================================
  # macOS：直接从 CNB 拉代码，GH Actions 原生构建
  # ===================================================================
  build-macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: amd64

    steps:
      - name: 从 CNB 克隆代码
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.branch }}" \
            "https://cnbcool:${{ secrets.CNB_TOKEN }}@cnb.cool/icxk/SFshell.git" repo
          echo "=== 克隆完成 ==="
          ls -la repo/
        shell: bash

      - name: 预装构建工具
        run: |
          brew install node@20 python@3.12
          echo "$(brew --prefix python@3.12)/libexec/bin" >> $GITHUB_PATH
          node -v && npm -v
          python3 --version
        shell: bash

      - name: 构建前端
        run: |
          cd repo/client
          npm install
          npm run build
        shell: bash

      - name: 创建虚拟环境并安装依赖
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          cd repo
          pip install -r server/requirements.txt
        shell: bash

      - name: PyInstaller 打包
        run: |
          source .venv/bin/activate
          cd repo
          pyinstaller --clean build.spec
        shell: bash

      - name: 生成 DMG 安装包
        run: |
          APP="repo/dist/SFshell.app"

          echo "=== 验证 .app ==="
          ls "$APP/Contents/MacOS/SFshell" || {
            echo "ERROR: .app 不存在，dist 目录内容:"
            ls -la repo/dist/
            exit 1
          }
          echo "OK"
          echo ""

          # 创建临时打包目录（只放 .app）
          STAGE="dmg_stage"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          # 计算 DMG 大小
          APP_SIZE=$(du -sk "$STAGE" | cut -f1)
          DMG_SIZE=$((APP_SIZE + 20480))

          DMG_TMP="SFshell-tmp.dmg"
          DMG_FINAL="SFshell-macOS-${{ matrix.arch }}.dmg"

          hdiutil create -volname "SFshell" -srcfolder "$STAGE" -ov -format UDRW \
            -size ${DMG_SIZE}k "$DMG_TMP"

          # 挂载并设置 Finder 布局
          DEV=$(hdiutil attach -readwrite -noverify -noautoopen "$DMG_TMP" | egrep '^/dev/' | sed 1q | awk '{print $1}')
          sleep 2

          osascript <<EOF
          tell application "Finder"
            tell disk "SFshell"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {400, 200, 900, 500}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 96
              set position of item "SFshell.app" of container window to {140, 130}
              set position of item "Applications" of container window to {360, 130}
              close
            end tell
          end tell
          EOF

          hdiutil detach "$DEV" -force
          hdiutil convert "$DMG_TMP" -format UDZO -imagekey zlib-level=9 -o "$DMG_FINAL"
          rm -f "$DMG_TMP"

          echo ""
          echo "=== DMG 已生成 ==="
          ls -lh "$DMG_FINAL"
        shell: bash

      - name: 上传制品（GitHub Actions）
        uses: actions/upload-artifact@v4
        with:
          name: SFshell-macOS-${{ matrix.arch }}
          path: SFshell-macOS-${{ matrix.arch }}.dmg
          retention-days: 30

  # ===================================================================
  # Windows：orange-runner 正常，可用于 CNB 流水线
  # ===================================================================
  start-runner-windows:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
            id_secret: SELF_HOSTED_ID_WIN_AMD64
          - os: windows-11-arm
            arch: arm64
            id_secret: SELF_HOSTED_ID_WIN_ARM64

    env:
      RUNNER_VERSION: "1.68.0"
      ORANGE_RUNNER_CONFIG_DIR: C:\orange-ci\etc
      ORANGE_RUNNER_DATA_DIR: C:\orange-ci\data

    steps:
      - name: 初始化目录
        run: |
          New-Item -Path "$env:ORANGE_RUNNER_CONFIG_DIR/orange-ci" -ItemType Directory -Force
          New-Item -Path "$env:ORANGE_RUNNER_DATA_DIR/orange-runner/logs" -ItemType Directory -Force
        shell: pwsh

      - name: 下载并配置 orange-runner
        run: |
          $ArchiveName = "orange-runner-$env:RUNNER_VERSION-windows-${{ matrix.arch }}.zip"
          $DownloadPath = "$env:RUNNER_TEMP\$ArchiveName"
          $InstallDir = "C:\orange-runner"

          Invoke-WebRequest -Uri "https://cnb.cool/cnb/cool/orange-runner-doc/-/releases/download/$env:RUNNER_VERSION/$ArchiveName" -OutFile $DownloadPath
          New-Item -Path $InstallDir -ItemType Directory -Force
          Expand-Archive -Path $DownloadPath -DestinationPath $InstallDir -Force

          $InstallDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $config = [PSCustomObject]@{
              cpus = -1
              defaultCpus = -1
              memory = -1
              quotaSize = @{}
              allowUseThisRunner = @{}
              useDocker = $false
              disableRsync = $true
              disableTls = $true
              connectorEndpoint = "${{ secrets.CONNECTOR_ENDPOINT }}"
              selfHostedId = "${{ secrets[matrix.id_secret] }}"
              dataRootDir = $env:ORANGE_RUNNER_DATA_DIR
          }
          $config | ConvertTo-Json -Depth 10 | Out-File -FilePath "$env:ORANGE_RUNNER_CONFIG_DIR\orange-ci\runner-config.json" -Encoding utf8
        shell: pwsh

      - name: 启动 CNB Runner
        run: orange-runner.exe
        shell: pwsh
